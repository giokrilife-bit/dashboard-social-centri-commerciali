
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Area amministratore - Dashboard Social</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #243247;
      margin: 0;
      padding: 30px 15px;
    }

    main {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.07);
    }

    h1 { color: #183b63; font-size: 24px; }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccd3dc;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      margin-right: 7px;
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #183b63;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #areaUpload, #logout { display: none; }

    #messaggio {
      margin-top: 18px;
      line-height: 1.5;
    }

    .nota {
      color: #687589;
      font-size: 14px;
      line-height: 1.5;
    }

    #risultato {
      margin-top: 20px;
    }

    #risultato pre {
      background: #f3f5f8;
      border: 1px solid #dce2e9;
      border-radius: 6px;
      padding: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.5;
      max-height: 450px;
      overflow-y: auto;
    }
  </style>
</head>

<body>
<main>

  <h1>Area amministratore</h1>
  <p class="nota">Dashboard Social Centri Commerciali</p>

  <section id="areaLogin">
    <h2>Accesso riservato</h2>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="login">Accedi</button>
  </section>

  <section id="areaUpload">
    <h2>Caricamento database</h2>

    <p>
      Seleziona il nuovo file Excel da caricare su Supabase.
    </p>

    <label for="fileExcel">File Excel (.xlsx)</label>

    <input
      id="fileExcel"
      type="file"
      accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    >

    <button id="carica">Carica file</button>
    <button id="verifica" disabled>Verifica file</button>
    <button id="importa" disabled>Importa dati</button>
    <button id="logout">Esci</button>
  </section>

  <div id="messaggio" role="status"></div>
  <div id="risultato"></div>

</main>

<script>
  const SUPABASE_URL =
    "https://gjeitedncggvvovifuej.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Oww_JhJicwb8whCwYZjJJw_vtcG720X";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const messaggio = document.getElementById("messaggio");
  const areaLogin = document.getElementById("areaLogin");
  const areaUpload = document.getElementById("areaUpload");

  const btnCarica = document.getElementById("carica");
  const btnVerifica = document.getElementById("verifica");
  const btnImporta = document.getElementById("importa");

  const risultato = document.getElementById("risultato");

  let percorsoCaricato = null;
  let nomeFileCaricato = null;
  let reportVerifica = null;

  function mostraMessaggio(testo, errore = false) {
    messaggio.textContent = testo;
    messaggio.style.color = errore ? "#b42318" : "#187044";
  }

  function mostraRisultato(dati) {
    risultato.innerHTML = "";

    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(dati, null, 2);

    risultato.appendChild(pre);
  }

  function mostraArea(autenticato) {
    areaLogin.style.display = autenticato ? "none" : "block";
    areaUpload.style.display = autenticato ? "block" : "none";

    document.getElementById("logout").style.display =
      autenticato ? "inline-block" : "none";
  }

  // ACCESSO AMMINISTRATORE

  document.getElementById("login").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    mostraMessaggio("Verifica accesso...");

    const { error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      mostraMessaggio(
        "Accesso non riuscito: " + error.message,
        true
      );
      return;
    }

    const { data, error: adminError } =
      await client.rpc("is_dashboard_admin");

    if (adminError || data !== true) {
      await client.auth.signOut();

      mostraMessaggio(
        "Questo account non è autorizzato.",
        true
      );
      return;
    }

    mostraArea(true);

    mostraMessaggio(
      "Accesso effettuato. Puoi selezionare il file Excel."
    );
  });

  // CARICAMENTO FILE EXCEL

  btnCarica.addEventListener("click", async () => {
    const file = document.getElementById("fileExcel").files[0];

    if (!file) {
      mostraMessaggio("Seleziona prima un file Excel.", true);
      return;
    }

    if (!file.name.toLowerCase().endsWith(".xlsx")) {
      mostraMessaggio(
        "È consentito soltanto un file .xlsx.",
        true
      );
      return;
    }

    if (file.size > 20 * 1024 * 1024) {
      mostraMessaggio(
        "Il file supera il limite massimo di 20 MB.",
        true
      );
      return;
    }

    btnCarica.disabled = true;
    btnVerifica.disabled = true;
    btnImporta.disabled = true;

    percorsoCaricato = null;
    nomeFileCaricato = null;
    reportVerifica = null;

    risultato.innerHTML = "";

    mostraMessaggio("Caricamento del file in corso...");

    // Nome univoco: non sovrascrive i file precedenti.
    const percorso = `${Date.now()}-${file.name}`;

    const { error } = await client.storage
      .from("import-social")
      .upload(percorso, file, {
        upsert: false,
        contentType:
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });

    btnCarica.disabled = false;

    if (error) {
      mostraMessaggio(
        "Caricamento non riuscito: " + error.message,
        true
      );
      return;
    }

    percorsoCaricato = percorso;
    nomeFileCaricato = file.name;

    btnVerifica.disabled = false;

    mostraMessaggio(
      "File caricato correttamente. Ora puoi eseguire la verifica preliminare."
    );
  });

  // VERIFICA PRELIMINARE: NON MODIFICA IL DATABASE

  btnVerifica.addEventListener("click", async () => {
    if (!percorsoCaricato) {
      mostraMessaggio(
        "Prima devi caricare un file Excel.",
        true
      );
      return;
    }

    btnVerifica.disabled = true;
    btnImporta.disabled = true;

    reportVerifica = null;
    risultato.innerHTML = "";

    mostraMessaggio(
      "Verifica preliminare in corso. Attendi..."
    );

    const { data, error } = await client.functions.invoke(
      "import-social",
      {
        body: {
          path: percorsoCaricato,
          filename: nomeFileCaricato,
          dry_run: true
        }
      }
    );

    btnVerifica.disabled = false;

    if (error) {
      mostraMessaggio(
        "Verifica non riuscita: " + error.message,
        true
      );
      return;
    }

    if (!data || data.success !== true) {
      mostraMessaggio(
        data?.error || "La verifica non è stata completata.",
        true
      );

      if (data) {
        mostraRisultato(data);
      }

      return;
    }

    if (
      data.modalita !== "VERIFICA" ||
      data.database_modificato !== false
    ) {
      mostraMessaggio(
        "Risposta della verifica non conforme. Importazione bloccata.",
        true
      );

      mostraRisultato(data);
      return;
    }

    reportVerifica = data;

    mostraRisultato(data);

    btnImporta.disabled = false;

    mostraMessaggio(
      "Verifica completata. Controlla attentamente il riepilogo prima di importare."
    );
  });

  // IMPORTAZIONE EFFETTIVA

  btnImporta.addEventListener("click", async () => {
    if (!percorsoCaricato || !reportVerifica) {
      mostraMessaggio(
        "Devi prima caricare e verificare il file.",
        true
      );
      return;
    }

    const conferma = window.confirm(
      "ATTENZIONE: stai per importare i dati nel database.\n\n" +
      "Hai controllato il rapporto di verifica?\n\n" +
      "Vuoi procedere con l'importazione?"
    );

    if (!conferma) {
      return;
    }

    btnCarica.disabled = true;
    btnVerifica.disabled = true;
    btnImporta.disabled = true;

    mostraMessaggio(
      "Importazione in corso. Non chiudere questa pagina..."
    );

    const { data, error } = await client.functions.invoke(
      "import-social",
      {
        body: {
          path: percorsoCaricato,
          filename: nomeFileCaricato,
          dry_run: false
        }
      }
    );

    if (error) {
      btnCarica.disabled = false;
      btnVerifica.disabled = false;

      mostraMessaggio(
        "Importazione non riuscita: " + error.message,
        true
      );
      return;
    }

    mostraRisultato(data);

    if (!data || data.success !== true) {
      btnCarica.disabled = false;
      btnVerifica.disabled = false;

      mostraMessaggio(
        data?.error || "Importazione non completata.",
        true
      );
      return;
    }

    reportVerifica = null;

    mostraMessaggio(
      "Importazione completata. Controlla il riepilogo qui sopra."
    );

    btnCarica.disabled = false;
  });

  // USCITA

  document.getElementById("logout").addEventListener("click", async () => {
    await client.auth.signOut();

    percorsoCaricato = null;
    nomeFileCaricato = null;
    reportVerifica = null;

    btnVerifica.disabled = true;
    btnImporta.disabled = true;

    risultato.innerHTML = "";

    mostraArea(false);
    mostraMessaggio("Sessione terminata.");
  });

  // CONTROLLO SESSIONE ESISTENTE

  client.auth.getSession().then(async ({ data }) => {
    if (!data.session) return;

    const { data: isAdmin, error } =
      await client.rpc("is_dashboard_admin");

    if (!error && isAdmin === true) {
      mostraArea(true);

      mostraMessaggio(
        "Sessione amministratore attiva."
      );
    } else {
      await client.auth.signOut();
      mostraArea(false);
    }
  });

</script>
</body>
</html>
